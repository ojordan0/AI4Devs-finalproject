<!DOCTYPE html><html lang="es" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;font-family:'Plus Jakarta Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'status-pending-bg': '#F8FAFC', 'whatsapp-green-hover': '#15803D', 'secondary': '#4059aa', 'error-container': '#ffdad6', 'on-secondary': '#ffffff', 'on-tertiary-container': '#ffb8a1', 'on-primary-container': '#8fd6bf', 'surface-subtle': '#F1F5F9', 'on-error': '#ffffff', 'surface-container-low': '#eff4ff', 'primary': '#004637', 'tertiary-fixed-dim': '#ffb59d', 'error': '#ba1a1a', 'status-purchased-border': '#93C5FD', 'status-unavailable-text': '#991B1B', 'status-unavailable-bg': '#FEF2F2', 'background': '#f8f9ff', 'surface-container-high': '#dce9ff', 'primary-fixed-dim': '#8dd4be', 'tertiary': '#722000', 'status-purchased-text': '#1E40AF', 'border-subtle': '#CBD5E1', 'on-error-container': '#93000a', 'primary-fixed': '#a8f1d9', 'on-tertiary-fixed': '#390c00', 'outline': '#6f7975', 'on-secondary-fixed-variant': '#264191', 'on-surface-variant': '#3f4945', 'text-primary': '#0F172A', 'on-secondary-container': '#1d3989', 'on-primary': '#ffffff', 'on-primary-fixed': '#002018', 'surface-variant': '#d3e4fe', 'status-reserved-bg': '#FFF7ED', 'inverse-on-surface': '#eaf1ff', 'status-reserved-border': '#FDBA74', 'inverse-primary': '#8dd4be', 'surface-dim': '#cbdbf5', 'secondary-fixed': '#dce1ff', 'surface-card': '#FFFFFF', 'primary-container': '#0d5f4d', 'inverse-surface': '#213145', 'status-unavailable-border': '#FCA5A5', 'on-surface': '#0b1c30', 'on-primary-fixed-variant': '#005141', 'on-background': '#0b1c30', 'surface-container': '#e5eeff', 'surface-container-lowest': '#ffffff', 'status-reserved-text': '#9A3412', 'text-muted': '#334155', 'tertiary-container': '#9a2e00', 'status-pending-text': '#334155', 'secondary-container': '#8fa7fe', 'surface-tint': '#1e6a57', 'on-tertiary-fixed-variant': '#832600', 'secondary-fixed-dim': '#b6c4ff', 'status-shipped-border': '#6EE7B7', 'status-pending-border': '#94A3B8', 'status-purchased-bg': '#EFF6FF', 'on-secondary-fixed': '#00164e', 'surface': '#f8f9ff', 'surface-bright': '#f8f9ff', 'surface-canvas': '#F8FAFC', 'status-shipped-bg': '#ECFDF5', 'tertiary-fixed': '#ffdbd0', 'border-strong': '#94A3B8', 'outline-variant': '#bec9c3', 'surface-container-highest': '#d3e4fe', 'on-tertiary': '#ffffff', 'whatsapp-green': '#16A34A', 'status-shipped-text': '#065F46' }, borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' }, spacing: { 'margin-desktop': '2rem', 'space-xl': '2rem', 'space-sm': '0.5rem', 'space-xs': '0.25rem', 'space-md': '1rem', 'gutter-desktop': '1.5rem', 'space-2xl': '3rem', 'margin': '1rem', 'gutter': '1rem', 'space-lg': '1.5rem' }, fontFamily: { 'body-xl': ['Plus Jakarta Sans'], 'headline-xl-mobile': ['Plus Jakarta Sans'], 'headline-xl': ['Plus Jakarta Sans'], 'label-sm': ['Plus Jakarta Sans'], 'caption': ['Plus Jakarta Sans'], 'body-md': ['Plus Jakarta Sans'], 'body-lg': ['Plus Jakarta Sans'], 'label-md': ['Plus Jakarta Sans'], 'label-lg': ['Plus Jakarta Sans'], 'headline-md': ['Plus Jakarta Sans'], 'headline-lg': ['Plus Jakarta Sans'] }, fontSize: { 'body-xl': ['18px', { lineHeight: '28px', fontWeight: '500' }], 'headline-xl-mobile': ['26px', { lineHeight: '34px', fontWeight: '700' }], 'headline-xl': ['32px', { lineHeight: '40px', fontWeight: '700' }], 'label-sm': ['14px', { lineHeight: '18px', fontWeight: '600' }], 'caption': ['14px', { lineHeight: '20px', fontWeight: '400' }], 'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }], 'body-lg': ['17px', { lineHeight: '26px', fontWeight: '400' }], 'label-md': ['15px', { lineHeight: '20px', fontWeight: '600' }], 'label-lg': ['16px', { lineHeight: '22px', fontWeight: '600' }], 'headline-md': ['20px', { lineHeight: '28px', fontWeight: '600' }], 'headline-lg': ['24px', { lineHeight: '32px', fontWeight: '700' }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen antialiased"><main class="flex-1 w-full bg-surface pt-safe pb-safe px-margin flex flex-col justify-center"><div class="flex flex-col w-full max-w-md mx-auto py-space-md">
<!-- Language Selector Header Bar -->
<div class="flex justify-end items-center mb-space-lg">
<div aria-label="Seleccionar idioma" class="inline-flex items-center p-1 bg-surface-container rounded-full shadow-sm" role="radiogroup">
<button aria-checked="true" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-label-sm font-label-sm transition-all duration-200 bg-surface-card text-text-primary shadow-sm" id="btn-lang-es" onclick="setLanguage('es')" role="radio" type="button">
<span class="text-base leading-none">🇪🇸</span>
<span class="">Español</span>
</button>
<button aria-checked="false" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-label-sm font-label-sm transition-all duration-200 text-text-muted hover:text-text-primary" id="btn-lang-en" onclick="setLanguage('en')" role="radio" type="button">
<span class="text-base leading-none">🇺🇸</span>
<span class="">English</span>
</button>
</div>
</div>
<!-- Main Card Container -->
<div class="flex flex-col bg-surface-card rounded-xl p-space-lg shadow-sm">
<!-- Brand Hero Section -->
<div class="flex flex-col items-center text-center mt-space-sm mb-space-xl">
<div class="relative w-24 h-24 mb-space-md flex items-center justify-center bg-primary rounded-2xl shadow-md transition-transform duration-300 hover:scale-105"><span class="material-symbols-outlined text-[44px] text-on-primary">shopping_bag</span><div class="absolute -bottom-1 -right-1 bg-status-shipped-bg p-1 rounded-full shadow-sm flex items-center justify-center ring-2 ring-surface-card"><span class="material-symbols-outlined text-whatsapp-green text-[18px]">verified_user</span></div></div>
<h1 class="text-headline-xl-mobile font-headline-xl-mobile text-text-primary tracking-tight mb-2">
        ComproParaTi
      </h1>
<p class="text-body-md font-body-md text-text-muted max-w-[280px] leading-relaxed" id="tagline-text">Compras familiares asistidas</p>
</div>
<!-- Human Caring Highlight Box -->
<div class="flex items-start gap-3 bg-surface-container-low rounded-xl p-space-md mb-space-lg">
<div class="w-10 h-10 rounded-full bg-surface-card flex items-center justify-center text-primary shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[24px]">favorite</span>
</div>
<div class="flex flex-col justify-center">
<span class="text-label-md font-label-md text-text-primary mb-0.5" id="benefit-title">
          Cuidado mutuo y cercanía
        </span>
<span class="text-caption font-caption text-text-muted" id="benefit-desc">
          Pide lo que necesites o ayuda a comprar sin enredos digitales.
        </span>
</div>
</div>
<!-- Primary Action: Continue with Google -->
<div class="flex flex-col gap-space-sm mb-space-lg">
<button aria-label="Continuar con Google" class="w-full min-h-[54px] bg-surface-card active:bg-surface-subtle hover:bg-surface-subtle text-text-primary rounded-xl px-space-md flex items-center justify-center gap-3 shadow-sm transition-all duration-150 focus:outline-none focus:bg-surface-subtle" id="btn-google-auth" onclick="handleGoogleSignIn()" type="button">
<!-- Official Google "G" Scaled Icon -->
<svg aria-hidden="true" class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="text-label-lg font-label-lg tracking-tight" id="google-btn-text">
          Continuar con Google
        </span>
</button>

</div>
<!-- Reassurance & Trust Badge -->
<div class="flex items-center justify-center gap-2 pt-space-md bg-status-shipped-bg/60 rounded-xl px-space-md py-3">
<span class="material-symbols-outlined text-whatsapp-green text-[22px] shrink-0" style="font-variation-settings: &quot;FILL&quot; 1;">
        chat
      </span>
<span class="text-label-sm font-label-sm text-status-shipped-text leading-tight text-center" id="trust-badge-text">
        Simple, seguro y siempre conectado con WhatsApp
      </span>
</div>
</div>
<!-- Accessible Warm Micro-help Footer -->

</div>
<script>
  const i18nContent = {
    es: {
      tagline: "Compras asistidas pensadas con amor para tus seres queridos",
      benefitTitle: "Cuidado mutuo y cercanía",
      benefitDesc: "Pide lo que necesites o ayuda a tu familia a comprar sin enredos digitales.",
      googleBtn: "Continuar con Google",
      termsHint: "Al ingresar, aceptas nuestra experiencia transparente, sin contratos raros ni letras pequeñas.",
      trustBadge: "Simple, seguro y siempre conectado con WhatsApp",
      help: "¿Necesitas una mano para empezar? Escríbenos en cualquier momento."
    },
    en: {
      tagline: "Assisted shopping made simple, caring, and reliable",
      benefitTitle: "Mutual care & family support",
      benefitDesc: "Request what you need or help your loved ones shop without digital hassles.",
      googleBtn: "Continue with Google",
      termsHint: "By signing in, you enjoy a transparent experience free of complex fine print.",
      trustBadge: "Safe, simple, and seamlessly connected with WhatsApp",
      help: "Need assistance getting started? We are here to help anytime."
    }
  };

  function setLanguage(lang) {
    const btnEs = document.getElementById('btn-lang-es');
    const btnEn = document.getElementById('btn-lang-en');
    const tagline = document.getElementById('tagline-text');
    const benefitTitle = document.getElementById('benefit-title');
    const benefitDesc = document.getElementById('benefit-desc');
    const googleBtnText = document.getElementById('google-btn-text');
    const termsHint = document.getElementById('terms-hint');
    const trustBadgeText = document.getElementById('trust-badge-text');
    const helpText = document.getElementById('help-text');

    if (lang === 'es') {
      btnEs.classList.add('bg-surface-card', 'text-text-primary', 'shadow-sm');
      btnEs.classList.remove('text-text-muted');
      btnEs.setAttribute('aria-checked', 'true');

      btnEn.classList.remove('bg-surface-card', 'text-text-primary', 'shadow-sm');
      btnEn.classList.add('text-text-muted');
      btnEn.setAttribute('aria-checked', 'false');
    } else {
      btnEn.classList.add('bg-surface-card', 'text-text-primary', 'shadow-sm');
      btnEn.classList.remove('text-text-muted');
      btnEn.setAttribute('aria-checked', 'true');

      btnEs.classList.remove('bg-surface-card', 'text-text-primary', 'shadow-sm');
      btnEs.classList.add('text-text-muted');
      btnEs.setAttribute('aria-checked', 'false');
    }

    const t = i18nContent[lang];
    tagline.textContent = t.tagline;
    benefitTitle.textContent = t.benefitTitle;
    benefitDesc.textContent = t.benefitDesc;
    googleBtnText.textContent = t.googleBtn;
    termsHint.textContent = t.termsHint;
    trustBadgeText.textContent = t.trustBadge;
    helpText.textContent = t.help;
  }

  function handleGoogleSignIn() {
    const btn = document.getElementById('btn-google-auth');
    btn.style.transform = 'scale(0.98)';
    setTimeout(() => {
      btn.style.transform = 'scale(1)';
    }, 150);
  }
</script></main>



</body></html>
