schema: spec-driven

# Shown to the AI when it creates any artifact. Points to the documents that
# own each fact instead of repeating them.
context: |
  Project: ComproParaTi, an assisted shopping platform. Read CLAUDE.md first;
  it lists the project rules and which document to read for each task.

  Work is tracked in GitHub Issues. Read an issue with: gh issue view <number>.
  Use the issue body and the docs/ files it references. Ignore issue comments
  unless told otherwise.

  The documents in docs/ are the source of truth. Each change implements one
  work ticket from docs/08-WORK-TICKETS.md §4 and is generated from that ticket
  and the documents it references. Use the traceability table in
  docs/01-PRD.md §19 to find every story, rule, endpoint, and entity related to
  a requirement.

  ID prefixes: US (user story), FR (functional requirement), BR (business
  rule), AC (acceptance criterion), E (epic), T (work ticket).

  If the ticket needs behavior the documents don't define, or the documents
  and the code disagree, stop and ask. The documents are updated first.

  DESIGN.md owns the visual design, and design/screens.md maps each screen
  to its route, component, Stitch folder, tickets, fit and status. Screens
  are being restyled in design tickets. If a change touches a screen whose
  Status is In progress, stop and tell the user.

rules:
  proposal:
    - Name the change like the ticket's branch in the ticket overview (docs/08-WORK-TICKETS.md §3) without the type prefix, for example t-07-groups-api for branch feat/t-07-groups-api (docs/08-WORK-TICKETS.md §1).
    - Start with the ticket ID and title, and link the ticket's GitHub issue from the ticket overview (docs/08-WORK-TICKETS.md §3).
    - List the stories, functional requirements, business rules, and acceptance criteria the ticket covers, by ID only.
    - Keep to the ticket's scope. Anything outside it goes under a Non-goals heading.
    - Under Impact, list every table, endpoint and component touched, by name. Mark each one as new or existing. Take each name from docs/ or the code. If a name isn't defined there, stop and ask instead of inventing one.
  specs:
    - Cite PRD IDs in each requirement instead of copying rule text.
    - Cover every acceptance criterion with a scenario, citing the docs/ file.
    - Name each scenario after the acceptance criterion it verifies, starting with its ID, for example "AC-59 ...".
    - When the ticket has no acceptance criterion IDs, name and verify each scenario as described in docs/07-SECURITY-AND-TESTING.md §2.6.
    - Interface text, emails, and WhatsApp messages are referenced by meaning, never written out; the wording lives in the translation files and docs/02-UX-DESIGN.md.
  design:
    - Follow docs/03-ARCHITECTURE.md for structure and layering, docs/04-DATA-MODEL.md for the schema, and docs/05-API.md for endpoints and errors.
    - Use only packages listed in docs/03-ARCHITECTURE.md §1.6. If another one is needed, stop and ask.
    - New or changed UI follows DESIGN.md and reuses the components in
      src/components/ui.
  tasks:
    - Ensure tasks are atomic and testable independently.
    - Include one task per acceptance criterion for its automated test, named with its ID (docs/07-SECURITY-AND-TESTING.md §2). In a ticket without acceptance criterion IDs, include one task per scenario instead.
    - Include tasks for items 3 to 5 of the definition of done in docs/08-WORK-TICKETS.md §1 that apply to the ticket, such as updating the owning document or the generated OpenAPI document. The tasks above cover item 2. Items 1, 6, and 7 (proposal review, session record, and pull request) are steps of the ticket workflow in CLAUDE.md, not tasks.
    - Name the exact tables, endpoints and components each task touches.
    - Reuse existing screen components and replace mock data with real data.
    - Cover the loading, empty and error states for each screen touched.

operations:
  apply:
    guidance:
      - Do not restyle existing UI beyond what the ticket's new UI needs; restyling is done in design tickets
      - Unless the ticket's scope includes the UI, stop and tell the user if the issue needs a UI change
